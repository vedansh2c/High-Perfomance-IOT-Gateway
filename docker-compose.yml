services:
  gateway:
    build:
      context: .
      target: gateway
    init: true
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ipc:/run/pulsegate
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 768m
    cpus: 2
    pids_limit: 7000
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: .
      target: backend
    init: true
    environment:
      GATEWAY_IPC: /run/pulsegate/gateway.sock
      GATEWAY_HOST: gateway
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
    volumes:
      - ipc:/run/pulsegate
    depends_on:
      gateway:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 512m
    cpus: 2
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  frontend:
    build:
      context: frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  ipc:
